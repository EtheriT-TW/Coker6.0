<div class="container containe_phone_nopx" data-import-role="product-import-layout">
    <div class="two_three_block d-flex flex-wrap">
        <div class="col-3 d-lg-block d-none pe-3">
            <div class="menu_directory bg-white"
                 data-import-role="menu-directory"
                 data-dirid=""
                 data-diridname="">
                <div class="title custom_h5 fw-bold py-3 px-3"></div>
                <div class="accordion accordion-flush"></div>

                <div class="menu-accordion-template d-none" data-role="menu-accordion-template">
                    <div class="accordion-item border-0 border-bottom">
                        <div class="accordion-header">
                            <button type="button"
                                    class="accordion-button collapsed custom_h5 sectitle"
                                    data-bs-toggle="collapse"
                                    data-bs-target=""

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="custom_h3 my-2 px-4 fw-bold"

                 data-edit-type="PageTitle"

            </div>

            <div class="edit_lock my-0">
                <div class="frame type_change_frame catalog_frame allowedit"
                     data-import-role="product-directory"
                     data-dirid=""
                     data-diridname="">
                    <div class="d-flex justify-content-end switch_control allowedit mb-2"
                         btn_text="1"
                         btn_grid="1"
                         btn_list="1">
                        <button type="button" class="btn_text d-flex bg-transparent border-0 align-items-center mx-1 allowedit d-none">
                            <span class="material-symbols-outlined fs-5 me-1">list</span>文字

                        <button type="button" class="btn_grid d-flex bg-transparent border-0 align-items-center mx-1 allowedit d-none">

                        </button>
                        <button type="button" class="btn_list d-flex bg-transparent border-0 align-items-center mx-1 text-black-50 allowedit d-none">
                            <span class="material-symbols-outlined fs-5 me-1">view_list</span>圖文
                        </button>
                        <button type="button" class="btn_prod_grid d-flex bg-transparent border-0 align-items-center mx-1 allowedit">
                            <span class="material-symbols-outlined fs-5 me-1">grid_on</span>商品圖片
                        </button>
                        <button type="button" class="btn_prod_list d-flex bg-transparent border-0 align-items-center mx-1 text-black-50 allowedit">
                            <span class="material-symbols-outlined fs-5 me-1">view_list</span>商品圖文
                        </button>
                    </div>

                    <div class="catalog content row row-cols-lg-4 gx-0 rounded-lg bg-light px-2">
                        <div class="templatecontent d-none" data-key="">
                            <div class="template p-2 py-2">
                                <div class="col bg-white p-2 position-sticky p-1 type4 rounded-lg h-100" data-key="">

                                        <figure class="d-flex justify-content-center mb-0 h-100 max-h flex-column" data-key="">
                                            <div class="image_frame d-flex flex-grow-1 justify-content-center align-items-center type4-image-frame w-100" data-key="">
                                                <img class="image gjs-plh-image img-fluid" data-key="" src="/upload/logo.png" alt="" />
                                            </div>
                                            <figcaption class="w-100 position-relative pb1 type4-caption d-flex flex-column" data-key="">
                                                <div class="item-header d-flex">
                                                    <div class="itemNo m-0 p-0 align-itmes-center type4-title d-inline fw-bold" data-key=""></div>
                                                </div>
                                                <div class="item-title">
                                                    <div class="catalog-number itemNo m-0 p-2 align-itmes-center type4-title d-inline" data-key=""></div>
                                                    <div class="title m-0 fs-5 align-itmes-center type4-title d-inline fs-6" data-key=""></div>
                                                    <div class="like-and-share top_line d-none">
                                                        <button type="button" class="btn_favorites bg-transparent border-0 d-none">
                                                            <i class="fs-5 fa-regular fa-heart"></i>
                                                            <span class="d-none">關注</span>
                                                        </button>
                                                    </div>
                                                </div>
                                                <p class="description mt-1 overflow-hidden p-2 d-none type2-content" data-key=""></p>
                                                <div class="more-btn position-absolute d-flex justify-content-center align-items-center d-none">

                                                </div>
                                                <div class="date d-flex justify-content-end align-items-center p-2 d-none" data-key=""></div>
                                                <div class="more text-end mt-1 d-none" data-key="">詳細介紹</div>
                                                <div class="price price-grid mt-auto type2-title fw-bold fs-7" data-key=""></div>
                                                <div class="bottom-row d-flex align-text-bottom" data-key="">
                                                    <div class="tags" data-key=""></div>
                                                    <div class="purchase d-none">
                                                        <div class="price price-discount me-auto p-2 align-itmes-center type2-title d-none" data-key=""></div>
                                                        <div class="price normal-price me-auto p-2 align-itmes-center type2-title fw-bold" data-key=""></div>
                                                        <span class="cart badge rounded-pill bg-secondary text-white me-auto p-2 px-4 align-itmes-center type2-title d-none fw-normal" data-key="">
                                                            <i class="fa-solid fa-cart-shopping fa-inverse"></i>
                                                            放入購物車
                                                        </span>
                                                    </div>
                                                </div>
                                            </figcaption>
                                        </figure>
                                    </a>
                                    <div class="shareBlock" data-init="true">
                                        <button type="button" class="btn_share bg-transparent border-0">
                                            <i class="fs-5 fa-solid fa-share"></i>
                                            <span class="d-none">分享</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="templatecontent-tag d-none" data-key="">
                            <span class="badge rounded-pill bg-light text-secondary fw-normal me-1 px-2"></span>
                        </div>
                    </div>

                    <nav aria-label="Catalog Page">
                        <ul class="page_btn d-flex justify-content-center my-5 pagination">
                            <li class="page-item btn_prev">
                                <button type="button" class="page-link text-black" aria-label="上一頁">
                                    <i class="fa-solid fa-angle-left"></i>
                                </button>
                            </li>
                            <li class="page-item btn_next">
                                <button type="button" class="page-link text-black" aria-label="下一頁">
                                    <i class="fa-solid fa-angle-right"></i>
                                </button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

</div>
